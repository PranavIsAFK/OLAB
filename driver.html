<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Portal - OLAP System</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
        }
        #map {
            height: 50vh;
            width: 100%;
            z-index: 10;
        }
        .itinerary-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .step-number {
            background: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-[1000]">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
                    <i class="fas fa-truck text-white text-xs"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none">Driver <span class="text-indigo-400">Portal</span></h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Active Route Optimization</p>
                </div>
            </div>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">
                <i class="fas fa-arrow-left mr-1"></i> Admin View
            </a>
        </div>
    </header>

    <!-- Map View -->
    <div id="map"></div>

    <!-- Instructions -->
    <main class="flex-1 p-4 -mt-6 relative z-[1000]">
        <div id="itineraryContainer" class="space-y-4">
            <!-- Populated by JS -->
            <div class="text-center py-12 opacity-50">
                <i class="fas fa-route text-4xl mb-4"></i>
                <p>Waiting for route data from Admin...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Actions -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800 sticky bottom-0 z-[1000]">
        <div class="grid grid-cols-2 gap-3">
            <button onclick="window.print()" class="py-3 bg-slate-800 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
                <i class="fas fa-print"></i> Print Manifest
            </button>
            <button onclick="location.reload()" class="py-3 bg-indigo-600 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh Route
            </button>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const routeData = JSON.parse(localStorage.getItem('olap_active_route'));
            if (!routeData) return;

            // Initialize Map
            const map = L.map('map').setView([routeData[0].lat, routeData[0].lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Draw Route
            const coords = routeData.map(p => [p.lat, p.lng]);
            L.polyline(coords, {
                color: '#6366f1',
                weight: 5,
                opacity: 0.8,
                dashArray: '10, 15'
            }).addTo(map);

            // Add Markers
            routeData.forEach((stop, i) => {
                const isWarehouse = stop.id === 'WAREHOUSE';
                const marker = L.marker([stop.lat, stop.lng]).addTo(map);
                marker.bindPopup(`<b>Step ${i+1}: ${stop.id}</b><br>${stop.address}`);
            });

            map.fitBounds(L.polyline(coords).getBounds(), { padding: [30, 30] });

            // Render Itinerary
            const container = document.getElementById('itineraryContainer');
            container.innerHTML = '';

            routeData.forEach((stop, i) => {
                const isWarehouse = stop.id === 'WAREHOUSE';
                const card = document.createElement('div');
                card.className = `itinerary-card p-4 rounded-2xl flex items-start gap-4 transition-all ${
                    i === 1 ? 'ring-2 ring-emerald-500 bg-emerald-500/5' : ''
                }`;
                
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg shrink-0 ${
                        isWarehouse ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                        ${i + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-base leading-tight">${stop.id}</h3>
                            ${i === 1 ? '<span class="bg-emerald-500 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-tighter">Next Stop</span>' : ''}
                        </div>
                        <p class="text-xs text-slate-400 line-clamp-2">${stop.address}</p>
                        ${!isWarehouse ? `
                            <div class="mt-2 flex gap-4 text-[10px] font-bold text-indigo-400">
                                <span><i class="fas fa-weight-hanging mr-1"></i> ${stop.weight} KG</span>
                                <span><i class="fas fa-box mr-1"></i> DELIVER</span>
                            </div>
                        ` : ''}
                    </div>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}" target="_blank" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition">
                        <i class="fas fa-directions"></i>
                    </a>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
